<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDevUnity — Channels & Live Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col relative pb-10">

    <header class="sticky top-0 z-40 px-8 py-4 flex items-center justify-between border-b border-[#262a35] bg-[#0f1115]">
        <a href="index.html" class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-[#161920] border border-[#262a35] flex items-center justify-center text-blue-400 font-bold text-base">
                <i class="fa-solid fa-code text-sm"></i>
            </div>
            <span class="text-lg font-bold tracking-tight text-white">ProDev<span class="text-blue-400">Unity</span></span>
        </a>

        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-xs font-medium text-slate-400 bg-[#161920] px-3 py-1.5 rounded-lg border border-[#262a35]">
                User: <strong id="current-username-display" class="text-blue-400">@guest</strong>
            </span>
            <button onclick="logout()" id="logout-btn" class="hidden text-xs bg-[#161920] hover:bg-[#222733] text-slate-300 border border-[#262a35] px-3.5 py-1.5 rounded-lg transition">Logout</button>
            <button onclick="openAuthModal()" id="login-btn" class="flat-btn-primary text-xs px-4 py-2 rounded-lg transition">Access Platform</button>
        </div>
    </header>

    <main id="main-container" class="max-w-6xl w-full mx-auto p-6 md:p-10 flex-1 z-10">
        <section class="space-y-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">Channels & Encrypted Chat</h1>
                    <p class="text-xs text-slate-400 mt-0.5">Private channels are End-to-End encrypted before saving to MySQL.</p>
                </div>
                <button onclick="openCreateChannelModal()" class="flat-btn-primary font-semibold px-3.5 py-2 rounded-lg text-xs flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus"></i>
                    <span>Create Channel</span>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div id="channels-list-container" class="space-y-2 overflow-y-auto max-h-[480px] pr-1">
                    <div class="text-slate-500 text-xs py-4 text-center">Loading channels...</div>
                </div>

                <div class="md:col-span-3 flat-card p-5 flex flex-col h-[480px]">
                    <div class="flex items-center justify-between pb-3 border-b border-[#262a35]">
                        <div class="flex items-center space-x-2">
                            <span id="active-channel-name" class="font-bold text-white text-xs"># nodejs-backend</span>
                            <span id="active-channel-badge" class="text-[10px] px-2 py-0.5 rounded bg-[#222733] text-slate-300 border border-[#262a35]">Public</span>
                        </div>
                        <span class="text-[10px] text-slate-500">End-to-End Encrypted</span>
                    </div>

                    <div id="chat-messages-box" class="flex-1 overflow-y-auto py-4 space-y-2.5 pr-2">
                        <div class="text-center py-12 text-slate-500 text-xs">Select a channel to join conversation.</div>
                    </div>

                    <form onsubmit="sendChatMessage(event)" class="pt-3 border-t border-[#262a35] flex space-x-2">
                        <input type="text" id="chat-input-text" required placeholder="Type encrypted message..." class="flex-1 bg-[#0f1115] border border-[#262a35] rounded-lg px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition">
                        <button type="submit" class="flat-btn-primary font-semibold px-4 py-2 rounded-lg text-xs">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- DOCK NAVIGAZIONE SEMPRE VISIBILE -->
    <div id="main-dock" class="fixed left-4 top-1/2 -translate-y-1/2 z-50">
        <div class="flat-dock-container flex flex-col items-center gap-2">
            <a href="index.html" class="dock-item" title="Home"><i class="fa-solid fa-house text-base"></i></a>
            <a href="feed.html" class="dock-item" title="Feed"><i class="fa-solid fa-fire text-base"></i></a>
            <a href="jobs.html" class="dock-item" title="Jobs"><i class="fa-solid fa-briefcase text-base"></i></a>
            <a href="directory.html" class="dock-item" title="Featured"><i class="fa-solid fa-crown text-base"></i></a>
            <a href="chat.html" class="dock-item active" title="Chat"><i class="fa-solid fa-comments text-base"></i></a>
        </div>
    </div>

    <script src="main.js"></script>
    <script>
        let activeChatChannel = 'nodejs-backend';
        let activeChannelType = 'public';
        let roomEncryptionKeys = JSON.parse(localStorage.getItem('room_encryption_keys')) || {};

        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser) openAuthModal();
            loadChatMessages();
        });

        async function loadChatMessages() {
            const container = document.getElementById('chat-messages-box');
            try {
                const res = await fetch(`${API_BASE_URL}/api/chat/${activeChatChannel}`);
                const messages = await res.json();

                if (!messages.length) {
                    container.innerHTML = '<div class="text-center py-12 text-slate-500 text-xs">No messages in this channel yet.</div>';
                    return;
                }

                container.innerHTML = messages.map(m => {
                    const decryptedText = activeChannelType === 'private' ? decryptText(m.text, roomEncryptionKeys[activeChatChannel]) : m.text;
                    const dateVal = Number(m.created_at) || Date.now(); // Risolta la discrepanza m.created_at

                    return `
                        <div class="bg-[#0f1115] p-3 rounded-lg border border-[#262a35] space-y-1">
                            <div class="flex items-center justify-between text-[10px]">
                                <span class="font-semibold text-blue-400">@${escapeHTML(m.sender)}</span>
                                <span class="text-slate-500">${new Date(dateVal).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                            </div>
                            <p class="text-xs text-slate-200">${escapeHTML(decryptedText)}</p>
                        </div>
                    `;
                }).join('');

                container.scrollTop = container.scrollHeight;
            } catch (err) {
                container.innerHTML = '<div class="text-red-400 text-xs py-4 text-center">Error loading chat.</div>';
            }
        }

        async function sendChatMessage(e) {
            e.preventDefault();
            if (!currentUser) { openAuthModal(); return; }

            const input = document.getElementById('chat-input-text');
            const rawText = input.value.trim();
            if (!rawText) return;

            const textToSend = activeChannelType === 'private' ? encryptText(rawText, roomEncryptionKeys[activeChatChannel]) : rawText;

            try {
                const res = await fetchWithAuth(`${API_BASE_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channel: activeChatChannel, text: textToSend })
                });

                const data = await res.json();
                if (data.ok) {
                    input.value = '';
                    loadChatMessages();
                }
            } catch (err) { alert('Failed to send message.'); }
        }
    </script>
</body>
</html>
