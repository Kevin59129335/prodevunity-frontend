<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script>
      if (localStorage.getItem('prodevunity_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDevUnity - Developer Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="min-h-screen bg-[#0b0c10] text-slate-100 flex flex-col antialiased">

    <!-- FLOATING CAPSULE SIDEBAR (DESKTOP) -->
    <aside class="fixed left-6 top-1/2 -translate-y-1/2 z-50 hidden sm:flex flex-col items-center py-6 px-3 bg-[#12151c]/90 backdrop-blur-md border border-[#232733] rounded-[2.5rem] shadow-2xl space-y-6">
        <!-- Feed (Flame) -->
        <a href="feed.html" title="Feed" class="w-12 h-12 flex items-center justify-center text-slate-400 hover:text-white transition group">
            <i class="fa-solid fa-fire text-xl group-hover:scale-110 transition-transform"></i>
        </a>
        <!-- Jobs (Briefcase) -->
        <a href="jobs.html" title="Jobs" class="w-12 h-12 flex items-center justify-center text-slate-400 hover:text-white transition group">
            <i class="fa-solid fa-briefcase text-xl group-hover:scale-110 transition-transform"></i>
        </a>
        <!-- Directory (Crown) - Active -->
        <a href="directory.html" title="Developer Directory" class="w-12 h-12 flex items-center justify-center bg-blue-600 text-white rounded-2xl shadow-lg shadow-blue-600/30 transition">
            <i class="fa-solid fa-crown text-xl"></i>
        </a>
        <!-- Chat (Comments) -->
        <a href="chat.html" title="Chat" class="w-12 h-12 flex items-center justify-center text-slate-400 hover:text-white transition group">
            <i class="fa-solid fa-comments text-xl group-hover:scale-110 transition-transform"></i>
        </a>
        <!-- Settings / Admin (Gear) -->
        <a href="admin.html" id="admin-sidebar-btn" title="Admin Settings" class="hidden w-12 h-12 flex items-center justify-center text-slate-400 hover:text-amber-400 transition group">
            <i class="fa-solid fa-gear text-xl group-hover:rotate-45 transition-transform"></i>
        </a>
    </aside>

    <!-- HEADER NAVIGATION -->
    <header class="px-8 py-5 flex items-center justify-between border-b border-[#262a35] sticky top-0 bg-[#0b0c10]/90 backdrop-blur-md z-40 sm:pl-28">
        <a href="feed.html" class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-blue-500/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-base shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                <i class="fa-solid fa-code"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-white">ProDev<span class="text-blue-400">Unity</span></span>
        </a>
        <div class="flex items-center space-x-4">
            <span id="current-username-display" class="text-sm font-semibold text-slate-300">@guest</span>
            <button onclick="toggleTheme()" class="text-slate-400 hover:text-white px-3 py-2 transition"><i class="fa-solid fa-circle-half-stroke"></i></button>
            <button id="logout-btn" onclick="logout()" class="flat-btn-primary bg-red-600/20 hover:bg-red-600/30 border border-red-500/30 text-red-400 text-xs px-4 py-2 rounded-lg font-semibold transition" style="display:none;">Logout</button>
            <button id="login-btn" onclick="window.location.href='index.html'" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-semibold transition">Sign In</button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-5xl w-full mx-auto px-6 py-10 space-y-8 flex-1 sm:pl-24">
        
        <div class="space-y-2">
            <h1 class="text-3xl font-bold tracking-tight text-white">Developer Directory</h1>
            <p class="text-sm text-slate-400">Profiles with client-verified ratings and reviews.</p>
        </div>

        <div id="directory-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamically populated developers -->
        </div>

    </main>

    <!-- MOBILE BOTTOM NAVIGATION BAR -->
    <nav class="sm:hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-[#12151c]/95 backdrop-blur-md border border-[#232733] rounded-full z-50 flex items-center space-x-2 p-2 shadow-2xl">
        <a href="feed.html" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-fire text-base"></i>
        </a>
        <a href="jobs.html" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-briefcase text-base"></i>
        </a>
        <a href="directory.html" class="w-10 h-10 flex items-center justify-center bg-blue-600 text-white rounded-full shadow-lg shadow-blue-600/30 transition">
            <i class="fa-solid fa-crown text-base"></i>
        </a>
        <a href="chat.html" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-comments text-base"></i>
        </a>
    </nav>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (currentUser && currentUser.role === 'admin') {
                const adminBtn = document.getElementById('admin-sidebar-btn');
                if (adminBtn) adminBtn.classList.remove('hidden');
            }
            loadDirectory();
        });

        async function loadDirectory() {
            const grid = document.getElementById('directory-grid');
            try {
                const res = await fetch(`${API_BASE_URL}/api/accounts`);
                const users = await res.json();

                if (!users || users.length === 0) {
                    grid.innerHTML = '<p class="text-slate-500 italic col-span-full">No users found in the directory.</p>';
                    return;
                }

                grid.innerHTML = users.map(user => `
                    <div class="flat-card p-6 border-[#262a35] bg-[#12151c] flex flex-col justify-between space-y-4 hover:border-slate-700 transition">
                        <div class="space-y-3">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-full bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 font-bold text-sm">
                                    <i class="fa-solid fa-at"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-white text-base">@${escapeHTML(user.username)}</h3>
                                    <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider ${
                                        user.role === 'admin' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' :
                                        user.role === 'client' ? 'bg-purple-500/20 text-purple-400 border border-purple-500/30' :
                                        'bg-blue-500/20 text-blue-400 border border-blue-500/30'
                                    }">${user.role}</span>
                                </div>
                            </div>
                            <p class="text-xs text-slate-400 line-clamp-3 leading-relaxed">${escapeHTML(user.bio || 'Developer on ProDevUnity')}</p>
                        </div>
                        <div class="pt-2 border-t border-[#262a35] flex items-center justify-between">
                            <span class="text-xs font-semibold text-amber-400 flex items-center gap-1">
                                <i class="fa-solid fa-star text-xs"></i> 5.0
                            </span>
                            <button onclick="contactUser('${escapeHTML(user.username)}')" class="bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 border border-blue-500/30 px-4 py-1.5 rounded-lg text-xs font-semibold transition">
                                Contact
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                grid.innerHTML = '<p class="text-red-400 col-span-full">Error loading developer directory.</p>';
            }
        }

        function contactUser(username) {
            window.location.href = `chat.html?user=${encodeURIComponent(username)}`;
        }
    </script>
</body>
</html>
