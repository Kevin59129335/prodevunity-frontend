<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script>
      if (localStorage.getItem('prodevunity_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDevUnity - Jobs Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body class="min-h-screen flex flex-col relative pb-10">
    
    <!-- HEADER -->
    <header class="sticky top-0 z-40 px-8 py-4 flex items-center justify-between border-b">
        <a href="feed.html" class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-sm">
                <i class="fa-solid fa-code"></i>
            </div>
            <span class="text-base font-bold tracking-tight">ProDev<span class="text-blue-400">Unity</span></span>
        </a>
        <div class="flex items-center space-x-4">
            <button onclick="toggleTheme()" class="p-2 rounded-lg border border-slate-700/50 hover:bg-slate-800/20 transition text-xs flex items-center space-x-1.5" title="Switch Theme">
                <i class="fa-solid fa-sun text-amber-400"></i>
                <i class="fa-solid fa-moon text-blue-400"></i>
            </button>
            <span id="user-display" class="text-xs font-medium text-slate-400 bg-[#161920] px-3 py-1.5 rounded-lg border border-[#262a35]">
                User: <strong id="current-username-display" class="text-blue-400">@guest</strong>
            </span>
            <button onclick="logout()" id="logout-btn" class="hidden text-xs bg-[#161920] hover:bg-[#222733] text-slate-300 border border-[#262a35] px-3.5 py-1.5 rounded-lg transition">Logout</button>
            <button onclick="window.location.href='index.html'" id="login-btn" class="flat-btn-primary text-xs px-4 py-2 rounded-lg transition">Sign In</button>
        </div>
    </header>

    <!-- MAIN DOCK (FIXED SIDEBAR) -->
    <div id="main-dock" class="fixed left-4 top-1/2 -translate-y-1/2 z-50">
        <div class="flat-dock-container flex flex-col items-center gap-2">
            <a href="feed.html" class="dock-item" title="Feed"><i class="fa-solid fa-fire text-base"></i></a>
            <a href="jobs.html" class="dock-item active" title="Jobs"><i class="fa-solid fa-briefcase text-base"></i></a>
            <a href="directory.html" class="dock-item" title="Directory"><i class="fa-solid fa-crown text-base"></i></a>
            <a href="chat.html" class="dock-item" title="Chat"><i class="fa-solid fa-comments text-base"></i></a>
            <a href="settings.html" class="dock-item" title="Settings"><i class="fa-solid fa-gear text-base"></i></a>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="max-w-6xl w-full mx-auto p-6 md:p-10 flex-1 z-10 space-y-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Jobs Board</h1>
                <p class="text-xs text-slate-400 mt-0.5" id="jobs-subtitle">Freelance projects and collaborations.</p>
            </div>
            <button id="post-job-btn" onclick="openCreateJobModal()" class="hidden flat-btn-primary font-semibold px-4 py-2 rounded-lg text-xs flex items-center space-x-2 self-start md:self-auto">
                <i class="fa-solid fa-plus"></i>
                <span>Post a Job</span>
            </button>
        </div>
        
        <div id="jobs-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="text-slate-500 text-xs">Loading jobs...</div>
        </div>
    </main>

    <!-- MODAL: POST JOB (CLIENTS ONLY) -->
    <div id="create-job-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
        <div class="flat-card max-w-md w-full p-6 space-y-4 relative">
            <button onclick="closeCreateJobModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">&times;</button>
            <h3 class="text-base font-bold text-white">Post a New Job</h3>
            <form onsubmit="handleCreateJob(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Job Title</label>
                    <input type="text" id="job-title" required class="w-full bg-[#0f1115] border border-[#262a35] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div class="flex gap-3">
                    <div class="flex-1">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Budget (e.g. €500)</label>
                        <input type="text" id="job-budget" required class="w-full bg-[#0f1115] border border-[#262a35] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div class="flex-1">
                        <label class="block text-xs font-medium text-slate-400 mb-1">Category</label>
                        <select id="job-category" class="w-full bg-[#0f1115] border border-[#262a35] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition">
                            <option value="Frontend">Frontend</option>
                            <option value="Backend">Backend</option>
                            <option value="Fullstack">Fullstack</option>
                            <option value="Design">Design</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Project Details</label>
                    <textarea id="job-description" rows="4" required class="w-full bg-[#0f1115] border border-[#262a35] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition"></textarea>
                </div>
                <button type="submit" id="submit-job-btn" class="w-full flat-btn-primary font-semibold py-2.5 rounded-lg text-xs tracking-wider">Publish Job</button>
            </form>
        </div>
    </div>

    <!-- MODAL: APPLY JOB (DEVS ONLY) -->
    <div id="apply-job-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
        <div class="flat-card max-w-md w-full p-6 space-y-4 relative">
            <button onclick="closeApplyModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">&times;</button>
            <h3 class="text-base font-bold text-white">Send Application</h3>
            <form onsubmit="handleApplyJob(event)" class="space-y-3">
                <input type="hidden" id="apply-job-id">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Your Proposal / Cover Letter</label>
                    <textarea id="apply-proposal" rows="5" required placeholder="Explain why you are the best fit for this project..." class="w-full bg-[#0f1115] border border-[#262a35] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition"></textarea>
                </div>
                <button type="submit" id="submit-apply-btn" class="w-full flat-btn-primary font-semibold py-2.5 rounded-lg text-xs tracking-wider">Submit Application</button>
            </form>
        </div>
    </div>

    <!-- MODAL: VIEW APPLICATIONS (CLIENTS ONLY) -->
    <div id="applications-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
        <div class="flat-card max-w-lg w-full p-6 space-y-4 relative max-h-[80vh] flex flex-col">
            <button onclick="closeApplicationsModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">&times;</button>
            <h3 class="text-base font-bold text-white">Job Applications</h3>
            <div id="applications-list" class="flex-1 overflow-y-auto space-y-3 pr-2">
                <!-- Applications loaded dynamically -->
            </div>
        </div>
    </div>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser) { window.location.href = 'index.html'; return; }
            if (currentUser.role === 'client') {
                document.getElementById('post-job-btn').classList.remove('hidden');
                document.getElementById('jobs-subtitle').innerText = "Manage the jobs you posted.";
            } else {
                document.getElementById('jobs-subtitle').innerText = "Find open projects and send your proposals.";
            }
            loadJobs();
        });

        async function loadJobs() {
            try {
                const res = await fetchWithAuth(`${API_BASE_URL}/api/jobs`);
                const data = await res.json();
                renderJobs(data.jobs || []);
            } catch (err) {
                document.getElementById('jobs-container').innerHTML = '<div class="text-red-400 text-xs py-4">Error loading jobs.</div>';
            }
        }

        function renderJobs(jobs) {
            const container = document.getElementById('jobs-container');
            if (!jobs.length) {
                container.innerHTML = `<div class="flat-card p-8 col-span-full text-center text-slate-500 text-xs">No jobs available right now.</div>`;
                return;
            }

            container.innerHTML = jobs.map(j => {
                let actionHtml = '';
                
                if (currentUser.role === 'client') {
                    const statusBadge = j.status === 'open' 
                        ? `<span class="text-emerald-400 font-bold text-[10px] uppercase bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">Open</span>` 
                        : `<span class="text-red-400 font-bold text-[10px] uppercase bg-red-500/10 px-2 py-0.5 rounded border border-red-500/20">Closed</span>`;
                    
                    actionHtml = `
                        <div class="flex items-center gap-3">
                            ${statusBadge}
                            <button onclick="viewApplications(${j.id})" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 hover:bg-blue-600/30 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                                View Applications (${j.app_count || 0})
                            </button>
                        </div>`;
                } else { // Developer rendering
                    if (j.my_application_status === 'pending') {
                        actionHtml = `<span class="text-amber-400 font-bold text-[10px] uppercase bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20"><i class="fa-solid fa-clock mr-1"></i> Pending</span>`;
                    } else if (j.my_application_status === 'rejected') {
                        actionHtml = `<span class="text-red-400 font-bold text-[10px] uppercase bg-red-500/10 px-2 py-1 rounded border border-red-500/20"><i class="fa-solid fa-xmark mr-1"></i> Rejected</span>`;
                    } else {
                        actionHtml = `<button onclick="openApplyModal(${j.id})" class="flat-btn-primary px-4 py-1.5 rounded-lg text-xs font-semibold transition">Apply Now</button>`;
                    }
                }

                return `
                    <div class="flat-card p-5 space-y-3 flex flex-col justify-between">
                        <div>
                            <div class="flex items-start justify-between">
                                <h3 class="text-sm font-bold text-white">${escapeHTML(j.title)}</h3>
                                <span class="text-emerald-400 font-bold text-sm bg-emerald-500/10 border border-emerald-500/20 px-2 py-1 rounded-lg shrink-0">${escapeHTML(j.budget)}</span>
                            </div>
                            <span class="text-[10px] text-slate-400 font-mono mt-1 block">Client: @${escapeHTML(j.client_username)} | Category: ${escapeHTML(j.category)}</span>
                        </div>
                        <p class="text-xs text-slate-300 line-clamp-3">${escapeHTML(j.description)}</p>
                        <div class="pt-3 border-t border-[#262a35] flex items-center justify-between text-xs">
                            <span class="text-slate-500 text-[10px]">${new Date(Number(j.created_at)).toLocaleDateString()}</span>
                            ${actionHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ================= CLIENT ACTIONS ================= //
        function openCreateJobModal() { document.getElementById('create-job-modal').classList.remove('hidden'); }
        function closeCreateJobModal() { document.getElementById('create-job-modal').classList.add('hidden'); }
        
        async function handleCreateJob(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-job-btn');
            btn.disabled = true; btn.innerText = 'Publishing...';
            
            const payload = {
                title: document.getElementById('job-title').value,
                budget: document.getElementById('job-budget').value,
                category: document.getElementById('job-category').value,
                description: document.getElementById('job-description').value
            };

            try {
                const res = await fetchWithAuth(`${API_BASE_URL}/api/jobs`, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    closeCreateJobModal();
                    loadJobs();
                    alert("Job published successfully!");
                }
            } catch (err) { alert('Error publishing job.'); }
            finally { btn.disabled = false; btn.innerText = 'Publish Job'; }
        }

        async function viewApplications(jobId) {
            const container = document.getElementById('applications-list');
            container.innerHTML = '<div class="text-xs text-slate-400 text-center py-4">Loading applications...</div>';
            document.getElementById('applications-modal').classList.remove('hidden');

            try {
                const res = await fetchWithAuth(`${API_BASE_URL}/api/jobs/${jobId}/applications`);
                const data = await res.json();
                
                if (!data.apps || !data.apps.length) {
                    container.innerHTML = '<div class="text-xs text-slate-500 text-center py-6">No applications received yet.</div>';
                    return;
                }

                container.innerHTML = data.apps.map(app => {
                    let controls = '';
                    if (app.status === 'pending') {
                        controls = `
                            <div class="flex gap-2">
                                <button onclick="updateApplicationStatus(${app.id}, 'accepted')" class="bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 px-3 py-1 rounded text-xs font-bold hover:bg-emerald-600/30 transition">Accept</button>
                                <button onclick="updateApplicationStatus(${app.id}, 'rejected')" class="bg-red-600/20 text-red-400 border border-red-500/30 px-3 py-1 rounded text-xs font-bold hover:bg-red-600/30 transition">Reject</button>
                            </div>
                        `;
                    } else if (app.status === 'accepted') {
                        controls = `<span class="text-emerald-400 font-bold text-[10px] uppercase bg-emerald-500/10 px-2 py-1 rounded border border-emerald-500/20"><i class="fa-solid fa-check"></i> Accepted</span>`;
                    } else {
                        controls = `<span class="text-red-400 font-bold text-[10px] uppercase bg-red-500/10 px-2 py-1 rounded border border-red-500/20"><i class="fa-solid fa-xmark"></i> Rejected</span>`;
                    }

                    return `
                        <div class="bg-[#0f1115] border border-[#262a35] rounded-lg p-4 space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-blue-400 text-xs">@${escapeHTML(app.dev_username)}</span>
                                <span class="text-slate-500 text-[10px]">${new Date(Number(app.created_at)).toLocaleDateString()}</span>
                            </div>
                            <p class="text-xs text-slate-300 bg-[#161920] p-2 rounded border border-[#262a35] whitespace-pre-wrap">${escapeHTML(app.proposal_text)}</p>
                            <div class="flex justify-end pt-2">
                                ${controls}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                container.innerHTML = '<div class="text-xs text-red-400 text-center py-4">Error loading data.</div>';
            }
        }

        async function updateApplicationStatus(appId, status) {
            if (!confirm(`Are you sure you want to mark this application as ${status.toUpperCase()}?`)) return;
            try {
                const res = await fetchWithAuth(`${API_BASE_URL}/api/applications/${appId}/status`, {
                    method: 'PUT',
                    body: JSON.stringify({ status })
                });
                if (res.ok) {
                    alert(`Application ${status}!`);
                    closeApplicationsModal();
                    loadJobs();
                }
            } catch (err) { alert('Error updating status.'); }
        }

        function closeApplicationsModal() { document.getElementById('applications-modal').classList.add('hidden'); }

        // ================= DEV ACTIONS ================= //
        function openApplyModal(jobId) { 
            document.getElementById('apply-job-id').value = jobId;
            document.getElementById('apply-proposal').value = '';
            document.getElementById('apply-job-modal').classList.remove('hidden'); 
        }
        function closeApplyModal() { document.getElementById('apply-job-modal').classList.add('hidden'); }
        
        async function handleApplyJob(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-apply-btn');
            btn.disabled = true; btn.innerText = 'Submitting...';
            const jobId = document.getElementById('apply-job-id').value;
            const text = document.getElementById('apply-proposal').value;

            try {
                const res = await fetchWithAuth(`${API_BASE_URL}/api/jobs/${jobId}/apply`, {
                    method: 'POST',
                    body: JSON.stringify({ proposal_text: text })
                });
                const data = await res.json();
                if (res.ok) {
                    closeApplyModal();
                    loadJobs();
                    alert("Application sent successfully!");
                } else {
                    alert(data.error || 'Failed to apply.');
                }
            } catch (err) { alert('Error submitting application.'); }
            finally { btn.disabled = false; btn.innerText = 'Submit Application'; }
        }
    </script>
</body>
</html>
