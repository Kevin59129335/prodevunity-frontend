<!DOCTYPE html>
<html lang="it">
<head>
    <script>
      // Applica il tema PRIMA del rendering della pagina per evitare il flash nero
      if (localStorage.getItem('prodevunity_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDevUnity - Community Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="min-h-screen flex flex-col relative pb-10">
    
    <header class="sticky top-0 z-40 px-8 py-4 flex items-center justify-between border-b">
        <a href="feed.html" class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-sm">
                <i class="fa-solid fa-code"></i>
            </div>
            <span class="text-base font-bold tracking-tight">ProDev<span class="text-blue-400">Unity</span></span>
        </a>
        <div class="flex items-center space-x-4">
            <button onclick="toggleTheme()" class="p-2 rounded-lg border border-slate-700/50 hover:bg-slate-800/20 transition text-xs flex items-center space-x-1.5" title="Cambia Tema">
                <i class="fa-solid fa-sun text-amber-400"></i>
                <i class="fa-solid fa-moon text-blue-400"></i>
            </button>
            <span id="user-display" class="text-xs font-medium text-slate-400 bg-[#161920] px-3 py-1.5 rounded-lg border border-[#262a35]">
                User: <strong id="current-username-display" class="text-blue-400">@guest</strong>
            </span>
            <button onclick="logout()" id="logout-btn" class="hidden text-xs bg-[#161920] hover:bg-[#222733] text-slate-300 border border-[#262a35] px-3.5 py-1.5 rounded-lg transition">Logout</button>
            <button onclick="openAuthModal()" id="login-btn" class="flat-btn-primary text-xs px-4 py-2 rounded-lg transition">Accedi</button>
        </div>
    </header>

    <main id="main-container" class="max-w-6xl w-full mx-auto p-6 md:p-10 flex-1 z-10">
        <section class="space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">Community Feed</h1>
                    <p class="text-xs text-slate-400 mt-0.5">Discussioni in tempo reale e code sandbox eseguibili.</p>
                </div>
                <button onclick="openNewPostModal()" class="flat-btn-primary font-semibold px-4 py-2 rounded-lg text-xs flex items-center space-x-2 self-start md:self-auto">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nuovo Post</span>
                </button>
            </div>

            <div id="posts-container" class="space-y-4"></div>
        </section>
    </main>

    <div id="main-dock" class="fixed left-4 top-1/2 -translate-y-1/2 z-50">
        <div class="flat-dock-container flex flex-col items-center gap-2">
            <a href="feed.html" class="dock-item active" title="Feed"><i class="fa-solid fa-fire text-base"></i></a>
            <a href="jobs.html" class="dock-item" title="Jobs"><i class="fa-solid fa-briefcase text-base"></i></a>
            <a href="directory.html" class="dock-item" title="Featured"><i class="fa-solid fa-crown text-base"></i></a>
            <a href="chat.html" class="dock-item" title="Chat"><i class="fa-solid fa-comments text-base"></i></a>
            <a href="settings.html" class="dock-item" title="Impostazioni"><i class="fa-solid fa-gear text-base"></i></a>
        </div>
    </div>

    <!-- MODALE NUOVO POST -->
    <div id="new-post-modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
        <div class="flat-card max-w-md w-full p-6 space-y-4 relative">
            <button onclick="closeNewPostModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">&times;</button>
            <h3 class="text-base font-bold text-white">Pubblica Discussione</h3>
            <form onsubmit="handleCreatePost(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Titolo</label>
                    <input type="text" id="post-title" required class="w-full bg-[#0f1115] border border-[#262a35] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Descrizione</label>
                    <textarea id="post-description" rows="3" required class="w-full bg-[#0f1115] border border-[#262a35] rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Code Snippet (JavaScript / HTML)</label>
                    <textarea id="post-code" rows="4" class="w-full bg-[#0f1115] font-mono text-xs border border-[#262a35] rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-blue-500 transition" placeholder="console.log('Hello ProDevUnity!');"></textarea>
                </div>
                <button type="submit" id="create-post-btn" class="w-full flat-btn-primary font-semibold py-2.5 rounded-lg text-xs uppercase tracking-wider">Pubblica Post</button>
            </form>
        </div>
    </div>

    <!-- BANNER COOKIE GDPR -->
    <div id="cookie-banner" class="hidden fixed bottom-4 right-4 max-w-xs bg-[#131722] border border-[#262a35] p-4 rounded-xl shadow-xl z-50 text-xs space-y-3">
        <p class="text-slate-300">Utilizziamo cookie tecnici per mantenere attiva la tua sessione in modo sicuro.</p>
        <div class="flex space-x-2">
            <button onclick="acceptCookies()" class="flat-btn-primary px-3 py-1 rounded font-semibold text-[11px]">Accetta</button>
            <a href="terms.html" class="text-slate-400 hover:text-white px-2 py-1 text-[11px]">Info</a>
        </div>
    </div>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser) { window.location.href = 'index.html'; return; }
            loadPosts();
        });

        async function loadPosts() {
            try {
                const res = await fetch(`${API_BASE_URL}/api/posts`);
                const posts = await res.json();
                renderPostsList(posts);
            } catch (err) {
                document.getElementById('posts-container').innerHTML = '<div class="text-red-400 text-xs py-4 text-center">Errore durante il caricamento dei post.</div>';
            }
        }

        function renderPostsList(posts) {
            const container = document.getElementById('posts-container');
            if (!posts.length) {
                container.innerHTML = '<div class="flat-card p-8 text-center text-slate-500 text-xs">Nessuna discussione trovata.</div>';
                return;
            }

            container.innerHTML = posts.map(p => {
                const postId = p.id;
                const hasCode = Boolean(p.code && p.code.trim());

                return `
                    <div class="flat-card p-5 space-y-3">
                        <div class="flex items-center justify-between text-xs">
                            <span class="font-bold text-blue-400">@${escapeHTML(p.author)}</span>
                            <span class="text-slate-500 text-[10px]">${new Date(Number(p.created_at)).toLocaleDateString()}</span>
                        </div>
                        <h3 class="text-sm font-bold">${escapeHTML(p.title)}</h3>
                        <p class="text-xs text-slate-300">${escapeHTML(p.description)}</p>

                        ${hasCode ? `
                            <div class="space-y-2 mt-3">
                                <div class="flex items-center justify-between bg-[#161920] px-3 py-1.5 rounded-t-lg border border-[#262a35] text-[11px]">
                                    <span class="text-slate-400 font-mono"><i class="fa-solid fa-terminal text-emerald-400 mr-1"></i> Live Sandbox</span>
                                    <button onclick="runSandboxCode(${postId})" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-1 rounded text-[10px] flex items-center space-x-1 transition">
                                        <i class="fa-solid fa-play"></i> <span>Esegui Codice</span>
                                    </button>
                                </div>
                                <textarea id="sandbox-editor-${postId}" class="w-full bg-[#0f1115] p-3 rounded-b-lg border border-t-0 border-[#262a35] text-[11px] font-mono text-slate-200 focus:outline-none focus:border-blue-500 transition resize-y" rows="4">${escapeHTML(p.code)}</textarea>

                                <div id="sandbox-output-container-${postId}" class="hidden space-y-1">
                                    <span class="text-[10px] font-semibold text-slate-400 uppercase">Console Output:</span>
                                    <div class="overflow-auto max-h-40 rounded-lg border border-[#262a35]">
                                        <iframe id="sandbox-frame-${postId}" sandbox="allow-scripts" class="w-full h-32 bg-white"></iframe>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function runSandboxCode(postId) {
            const codeArea = document.getElementById(`sandbox-editor-${postId}`);
            const outputContainer = document.getElementById(`sandbox-output-container-${postId}`);
            const frame = document.getElementById(`sandbox-frame-${postId}`);
            if (!codeArea || !frame) return;

            outputContainer.classList.remove('hidden');
            frame.srcdoc = `
                <!DOCTYPE html>
                <html>
                <head>
                    <style>
                        body { font-family: monospace; font-size: 11px; margin: 8px; color: #111; word-break: break-all; }
                        .err { color: red; font-weight: bold; }
                    </style>
                </head>
                <body>
                    <div id="out"></div>
                    <script>
                        const out = document.getElementById('out');
                        console.log = function(...args) {
                            const msg = document.createElement('div');
                            msg.innerText = '> ' + args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
                            out.appendChild(msg);
                        };
                        window.onerror = function(msg) {
                            const err = document.createElement('div');
                            err.className = 'err';
                            err.innerText = 'Error: ' + msg;
                            out.appendChild(err);
                        };
                    <\/script>
                    <script>
                        try { ${codeArea.value} } catch(e) { console.log('Runtime Error: ' + e.message); }
                    <\/script>
                </body>
                </html>
            `;
        }

        function openNewPostModal() { document.getElementById('new-post-modal').classList.remove('hidden'); }
        function closeNewPostModal() { document.getElementById('new-post-modal').classList.add('hidden'); }

        async function handleCreatePost(e) {
            e.preventDefault();
            const btn = document.getElementById('create-post-btn');
            btn.disabled = true;
            btn.innerText = 'Pubblicazione...';

            const title = document.getElementById('post-title').value;
            const description = document.getElementById('post-description').value;
            const code = document.getElementById('post-code').value;

            try {
                const res = await fetchWithAuth(`${API_BASE_URL}/api/posts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, code })
                });
                const data = await res.json();
                if (data.ok) {
                    closeNewPostModal();
                    loadPosts();
                }
            } catch (err) { alert('Errore nella pubblicazione del post.'); }
            finally {
                btn.disabled = false;
                btn.innerText = 'Pubblica Post';
            }
        }
    </script>
</body>
</html>
