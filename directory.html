<!DOCTYPE html>
<html lang="it">
<head>
    <script>
      // Applica il tema PRIMA del rendering della pagina per evitare il flash nero
      if (localStorage.getItem('prodevunity_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDevUnity - Directory Sviluppatori</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col relative pb-10">

    <header class="sticky top-0 z-40 px-8 py-4 flex items-center justify-between border-b">
        <a href="feed.html" class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-sm">
                <i class="fa-solid fa-code"></i>
            </div>
            <span class="text-base font-bold tracking-tight">ProDev<span class="text-blue-400">Unity</span></span>
        </a>
        <div class="flex items-center space-x-4">
            <button onclick="toggleTheme()" class="p-2 rounded-lg border border-slate-700/50 hover:bg-slate-800/20 transition text-xs flex items-center space-x-1.5" title="Cambia Tema">
                <i class="fa-solid fa-sun text-amber-400"></i>
                <i class="fa-solid fa-moon text-blue-400"></i>
            </button>
            <span id="user-display" class="text-xs font-medium text-slate-400 bg-[#161920] px-3 py-1.5 rounded-lg border border-[#262a35]">
                User: <strong id="current-username-display" class="text-blue-400">@guest</strong>
            </span>
            <button onclick="logout()" id="logout-btn" class="text-xs bg-[#161920] hover:bg-[#222733] text-slate-300 border border-[#262a35] px-3.5 py-1.5 rounded-lg transition">Logout</button>
        </div>
    </header>

    <main class="max-w-6xl w-full mx-auto p-6 md:p-10 flex-1 z-10 space-y-6">
        <div>
            <h1 class="text-2xl font-bold">Directory Sviluppatori</h1>
            <p class="text-xs text-slate-400">Profili con valutazioni e recensioni verificate dai clienti.</p>
        </div>

        <div id="developers-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="text-slate-500 text-xs col-span-full">Caricamento sviluppatori...</div>
        </div>
    </main>

    <div id="main-dock" class="fixed left-4 top-1/2 -translate-y-1/2 z-50">
        <div class="flat-dock-container flex flex-col items-center gap-2">
            <a href="feed.html" class="dock-item" title="Feed"><i class="fa-solid fa-fire text-base"></i></a>
            <a href="jobs.html" class="dock-item" title="Jobs"><i class="fa-solid fa-briefcase text-base"></i></a>
            <a href="directory.html" class="dock-item active" title="Directory"><i class="fa-solid fa-crown text-base"></i></a>
            <a href="chat.html" class="dock-item" title="Chat"><i class="fa-solid fa-comments text-base"></i></a>
            <a href="settings.html" class="dock-item" title="Impostazioni"><i class="fa-solid fa-gear text-base"></i></a>
        </div>
    </div>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadDevelopers);

        async function loadDevelopers() {
            const grid = document.getElementById('developers-grid');
            try {
                const res = await fetch(`${API_BASE_URL}/api/accounts`);
                const devs = await res.json();

                if (!devs.length) {
                    grid.innerHTML = '<div class="text-slate-500 text-xs col-span-full">Nessuno sviluppatore registrato.</div>';
                    return;
                }

                grid.innerHTML = devs.map(dev => `
                    <div class="flat-card p-5 flex flex-col justify-between space-y-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-blue-600/20 border border-blue-500/30 flex items-center justify-center font-bold text-blue-400 text-sm">
                                @
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-white">@${escapeHTML(dev.username)}</h3>
                                <span class="text-[10px] px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase font-semibold">
                                    ${escapeHTML(dev.role || 'dev')}
                                </span>
                            </div>
                        </div>
                        <p class="text-xs text-slate-300 line-clamp-3">${escapeHTML(dev.bio || 'Nessuna biografia inserita.')}</p>
                        <div class="pt-3 border-t border-[#262a35] flex items-center justify-between text-xs">
                            <span class="text-amber-400 font-bold"><i class="fa-solid fa-star"></i> 5.0</span>
                            <a href="chat.html" class="flat-btn-primary px-3 py-1 rounded-lg text-xs">Contatta</a>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                grid.innerHTML = '<div class="text-red-400 text-xs col-span-full">Errore nel caricamento della directory.</div>';
            }
        }
    </script>
</body>
</html>
