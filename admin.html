<!DOCTYPE html>
<html lang="it">
<head>
    <script>
      // Applica il tema PRIMA del rendering della pagina per evitare il flash nero
      if (localStorage.getItem('prodevunity_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDevUnity - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col relative pb-10">
    
    <header class="sticky top-0 z-40 px-8 py-4 flex items-center justify-between border-b">
        <a href="feed.html" class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-amber-600/20 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-sm">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span class="text-base font-bold tracking-tight">Admin<span class="text-amber-400">Control</span></span>
        </a>
        <div class="flex items-center space-x-4">
            <button onclick="toggleTheme()" class="p-2 rounded-lg border border-slate-700/50 hover:bg-slate-800/20 transition text-xs flex items-center space-x-1.5" title="Cambia Tema">
                <i class="fa-solid fa-sun text-amber-400"></i>
                <i class="fa-solid fa-moon text-blue-400"></i>
            </button>
            <button onclick="logout()" id="logout-btn" class="text-xs bg-[#161920] hover:bg-[#222733] text-slate-300 border border-[#262a35] px-3.5 py-1.5 rounded-lg transition">Logout</button>
        </div>
    </header>

    <main id="main-container" class="max-w-5xl w-full mx-auto p-6 md:p-10 flex-1 z-10 space-y-8">
        <h1 class="text-2xl font-bold tracking-tight">Statistiche & Moderazione Piattaforma</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="flat-card p-5 space-y-1">
                <span class="text-xs text-slate-400">Utenti Registrati</span>
                <p id="stat-users" class="text-2xl font-bold text-blue-400">0</p>
            </div>
            <div class="flat-card p-5 space-y-1">
                <span class="text-xs text-slate-400">Post Pubblicati</span>
                <p id="stat-posts" class="text-2xl font-bold text-emerald-400">0</p>
            </div>
            <div class="flat-card p-5 space-y-1">
                <span class="text-xs text-slate-400">Messaggi Chat</span>
                <p id="stat-messages" class="text-2xl font-bold text-amber-400">0</p>
            </div>
        </div>
    </main>

    <!-- BANNER COOKIE GDPR -->
    <div id="cookie-banner" class="hidden fixed bottom-4 right-4 max-w-xs bg-[#131722] border border-[#262a35] p-4 rounded-xl shadow-xl z-50 text-xs space-y-3">
        <p class="text-slate-300">Utilizziamo cookie tecnici per mantenere attiva la tua sessione in modo sicuro.</p>
        <div class="flex space-x-2">
            <button onclick="acceptCookies()" class="flat-btn-primary px-3 py-1 rounded font-semibold text-[11px]">Accetta</button>
            <a href="terms.html" class="text-slate-400 hover:text-white px-2 py-1 text-[11px]">Info</a>
        </div>
    </div>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (!currentUser || currentUser.role !== 'admin') {
                alert('Accesso riservato agli amministratori.');
                window.location.href = 'index.html';
                return;
            }
            loadAdminStats();
        });

        async function loadAdminStats() {
            try {
                const res = await fetchWithAuth(`${API_BASE_URL}/api/admin/stats`);
                const data = await res.json();
                document.getElementById('stat-users').innerText = data.totalUsers || 0;
                document.getElementById('stat-posts').innerText = data.totalPosts || 0;
                document.getElementById('stat-messages').innerText = data.totalMessages || 0;
            } catch (err) { console.error('Admin stats error'); }
        }
    </script>
</body>
</html>
