<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script>
      if (localStorage.getItem('prodevunity_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDevUnity - Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="min-h-screen flex flex-col bg-[#0b0c10] text-slate-100">

    <!-- HEADER NAVIGATION -->
    <header class="px-8 py-5 flex items-center justify-between border-b border-[#262a35] sticky top-0 bg-[#0b0c10]/90 backdrop-blur-md z-50">
        <a href="feed.html" class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold text-base">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-white">Admin<span class="text-amber-400">Control</span></span>
        </a>
        <div class="flex items-center space-x-4">
            <button onclick="toggleTheme()" class="text-slate-400 hover:text-white px-3 py-2 transition"><i class="fa-solid fa-circle-half-stroke"></i></button>
            <button onclick="logout()" class="flat-btn-primary bg-red-600/20 hover:bg-red-600/30 border border-red-500/30 text-red-400 text-xs px-4 py-2 rounded-lg font-semibold transition">Logout</button>
        </div>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="max-w-6xl w-full mx-auto px-6 py-10 space-y-10 flex-1">
        
        <div class="space-y-2">
            <h1 class="text-2xl font-bold tracking-tight text-white">Platform Statistics & Moderation</h1>
            <p class="text-xs text-slate-400">Control panel reserved for administrators.</p>
        </div>

        <!-- DYNAMIC COUNTERS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="flat-card p-6 space-y-2 border-[#262a35]">
                <span class="text-xs text-slate-400 font-medium">Registered Users</span>
                <p id="stat-users" class="text-3xl font-extrabold text-blue-400">...</p>
            </div>
            <div class="flat-card p-6 space-y-2 border-[#262a35]">
                <span class="text-xs text-slate-400 font-medium">Published Posts</span>
                <p id="stat-posts" class="text-3xl font-extrabold text-emerald-400">...</p>
            </div>
            <div class="flat-card p-6 space-y-2 border-[#262a35]">
                <span class="text-xs text-slate-400 font-medium">Chat Messages</span>
                <p id="stat-messages" class="text-3xl font-extrabold text-amber-400">...</p>
            </div>
        </div>

        <!-- USER MANAGEMENT TABLE -->
        <div class="space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-users text-blue-400"></i> User Management
            </h2>
            <div class="flat-card overflow-hidden border-[#262a35]">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-[#12151c] text-slate-400 border-b border-[#262a35] uppercase text-[10px] tracking-wider">
                        <tr>
                            <th class="p-4">ID</th>
                            <th class="p-4">Username</th>
                            <th class="p-4">Role</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-[#262a35]">
                        <tr><td colspan="4" class="p-4 text-center text-slate-500">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- POST MODERATION TABLE -->
        <div class="space-y-4">
            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <i class="fa-solid fa-newspaper text-emerald-400"></i> Post Moderation
            </h2>
            <div class="flat-card overflow-hidden border-[#262a35]">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-[#12151c] text-slate-400 border-b border-[#262a35] uppercase text-[10px] tracking-wider">
                        <tr>
                            <th class="p-4">ID</th>
                            <th class="p-4">Post Title</th>
                            <th class="p-4">Author</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="posts-table-body" class="divide-y divide-[#262a35]">
                        <tr><td colspan="4" class="p-4 text-center text-slate-500">Loading posts...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!currentUser || currentUser.role !== 'admin') {
                alert('Access denied: Admin privileges required.');
                window.location.href = 'feed.html';
                return;
            }
            loadStats();
            loadAdminUsers();
            loadAdminPosts();
        });

        async function loadStats() {
            try {
                const res = await fetchWithAuth(`${API_BASE_URL}/api/admin/stats`);
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('stat-users').textContent = data.usersCount || 0;
                    document.getElementById('stat-posts').textContent = data.postsCount || 0;
                    document.getElementById('stat-messages').textContent = data.messagesCount || 0;
                }
            } catch (e) {
                console.error("Admin stats error:", e);
            }
        }

        async function loadAdminUsers() {
            const tbody = document.getElementById('users-table-body');
            try {
                const res = await fetch(`${API_BASE_URL}/api/accounts`);
                const users = await res.json();
                if (!users.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">No users found.</td></tr>';
                    return;
                }
                tbody.innerHTML = users.map(u => `
                    <tr class="hover:bg-[#161922] transition">
                        <td class="p-4 font-mono text-slate-400">#${u.id}</td>
                        <td class="p-4 font-bold text-white">@${escapeHTML(u.username)}</td>
                        <td class="p-4"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${u.role === 'admin' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-blue-500/20 text-blue-400'}">${u.role.toUpperCase()}</span></td>
                        <td class="p-4 text-right">
                            ${u.role !== 'admin' ? `<button onclick="deleteUser(${u.id})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1 rounded text-xs transition">Delete</button>` : '<span class="text-slate-600 text-[10px]">Protected</span>'}
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-400">Error loading users.</td></tr>';
            }
        }

        async function loadAdminPosts() {
            const tbody = document.getElementById('posts-table-body');
            try {
                const res = await fetch(`${API_BASE_URL}/api/posts`);
                const posts = await res.json();
                if (!posts.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-500">No posts found.</td></tr>';
                    return;
                }
                tbody.innerHTML = posts.map(p => `
                    <tr class="hover:bg-[#161922] transition">
                        <td class="p-4 font-mono text-slate-400">#${p.id}</td>
                        <td class="p-4 font-semibold text-slate-200">${escapeHTML(p.title)}</td>
                        <td class="p-4 text-slate-400">@${escapeHTML(p.author || 'Anonymous')}</td>
                        <td class="p-4 text-right">
                            <button onclick="deletePost(${p.id})" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1 rounded text-xs transition">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-red-400">Error loading posts.</td></tr>';
            }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user?')) return;
            const res = await fetchWithAuth(`${API_BASE_URL}/api/admin/users/${id}`, { method: 'DELETE' });
            if (res.ok) {
                alert('User deleted.');
                loadAdminUsers();
                loadStats();
            } else {
                alert('Error deleting user.');
            }
        }

        async function deletePost(id) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            const res = await fetchWithAuth(`${API_BASE_URL}/api/admin/posts/${id}`, { method: 'DELETE' });
            if (res.ok) {
                alert('Post deleted.');
                loadAdminPosts();
                loadStats();
            } else {
                alert('Error deleting post.');
            }
        }
    </script>
</body>
</html>
