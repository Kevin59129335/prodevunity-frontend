<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <script>
      if (localStorage.getItem('prodevunity_theme') === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDevUnity - Landing Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body class="min-h-screen flex flex-col bg-[#0b0c10] text-slate-100">

    <header class="px-8 py-5 flex items-center justify-between border-b border-[#262a35] sticky top-0 bg-[#0b0c10]/90 backdrop-blur-md z-50">
        <a href="index.html" class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-lg bg-blue-500/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold text-base shadow-[0_0_15px_rgba(59,130,246,0.3)]">
                <i class="fa-solid fa-code"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-white">ProDev<span class="text-blue-400">Unity</span></span>
        </a>
        <div class="flex items-center space-x-4">
            <span id="current-username-display" class="text-sm font-semibold text-slate-300">@guest</span>
            <a id="admin-nav-btn" href="admin.html" class="hidden text-amber-400 bg-amber-500/10 border border-amber-500/20 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-amber-500/20 transition"><i class="fa-solid fa-shield-halved mr-1"></i> Admin</a>
            <button onclick="toggleTheme()" class="text-slate-400 hover:text-white px-3 py-2 transition"><i class="fa-solid fa-circle-half-stroke"></i></button>
            <button id="login-btn" onclick="openAuthModal('login')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-2 rounded-lg font-semibold transition">Accedi</button>
            <button id="logout-btn" onclick="logout()" class="flat-btn-primary bg-red-600/20 hover:bg-red-600/30 border border-red-500/30 text-red-400 text-xs px-4 py-2 rounded-lg font-semibold transition" style="display:none;">Logout</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center px-6 py-20 text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight mb-6">
            Build Faster. Collaborate. <br>
            <span class="text-blue-400">On ProDevUnity.</span>
        </h1>
        <p class="text-slate-400 text-base md:text-lg max-w-2xl mb-10">
            Piattaforma ad alte prestazioni per Full-Stack Developers e Clienti. Incarichi e pagamenti protetti al 100% in totale sicurezza.
        </p>
        <div class="flex space-x-4">
            <button onclick="openAuthModal('register')" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30 transition">Unisciti Ora</button>
            <button onclick="openAuthModal('login')" class="bg-[#12151c] hover:bg-[#181c26] text-slate-300 border border-[#262a35] px-6 py-3 rounded-xl font-bold text-sm transition">Accedi</button>
        </div>
    </main>

    <!-- MODALE AUTENTICAZIONE -->
    <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#13151b] border border-[#232733] rounded-2xl w-full max-w-md p-6 space-y-6 relative shadow-2xl">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="text-center space-y-1">
                <h2 id="modal-title" class="text-xl font-bold text-white">Accedi a ProDevUnity</h2>
                <p class="text-xs text-slate-400">Join the developer network.</p>
            </div>

            <!-- TAB SELECTOR -->
            <div class="flex bg-[#0b0c10] p-1 rounded-lg border border-[#232733]">
                <button id="tab-login" onclick="openAuthModal('login')" class="w-1/2 py-2 rounded-md font-semibold text-xs transition bg-[#1c1f28] text-white shadow">
                    Login
                </button>
                <button id="tab-register" onclick="openAuthModal('register')" class="w-1/2 py-2 rounded-md font-semibold text-xs transition text-slate-400 hover:text-white">
                    Register
                </button>
            </div>

            <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
                    <input type="text" id="auth-username" required class="w-full bg-[#0b0c10] border border-[#232733] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-[#0b0c10] border border-[#232733] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div id="role-select-group" class="hidden">
                    <label class="block text-xs font-medium text-slate-400 mb-1">Account Role</label>
                    <select id="auth-role" class="w-full bg-[#0b0c10] border border-[#232733] rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <option value="dev">Developer (dev_)</option>
                        <option value="client">Client (client_)</option>
                    </select>
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg font-bold text-xs uppercase tracking-wider transition">
                    Accedi
                </button>
            </form>

            <div class="text-center text-xs text-slate-400" id="auth-toggle-text">
                Non hai un account? <a href="#" onclick="openAuthModal('register')" class="text-blue-400 font-bold">Registrati</a>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
